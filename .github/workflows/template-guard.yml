name: Template Guard

# Every removable template-only job lives in this one workflow because the fill-in push runs
# on the Actions token, which GitHub bars from creating or updating files under
# .github/workflows but allows to delete them — so fill-in-scaffold.yml removes this file
# whole. The one non-removable piece stays in release.yml: its repository-ID condition on the
# release job, which is what actually prevents a template publication. Every job here is
# keyed to this repository's immutable ID, so a not-yet-filled generated repository skips
# them all.

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # The template never versions itself: the fragment set, the header-only changelog, and the
  # 1.0.0 spawn seed are pinned. The repository_id comparison survives renames and transfers.
  trunk-only-state:
    name: Enforce the trunk-only template state
    if: github.repository_id == '1297277915'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the trunk-only template state
        run: |
          set -euo pipefail

          expected_fragments=$'changelog/.gitkeep\nchangelog/initial-template-population'
          actual_fragments=$(git ls-files changelog)
          if [ "$actual_fragments" != "$expected_fragments" ]; then
            echo "::error::the template is trunk-only: its history lives in git, so template PRs never add changelog fragments (the changelog machinery is scaffold payload for generated plugins)"
            exit 1
          fi

          if ! diff -q CHANGELOG.md - <<'CANONICAL' >/dev/null
          # Changelog

          Entries in this file are generated from fragments in the `changelog/` directory by running `composer changelog:write`. Do not edit this file directly.
          CANONICAL
          then
            echo "::error::the template is trunk-only: it never releases, so CHANGELOG.md stays exactly its fragment-instructions header"
            exit 1
          fi

          if ! grep -Eq '^ \* Version:[[:space:]]+1\.0\.0$' a8csp-template-plugin.php ||
             ! grep -Fq '"version": "1.0.0"' package.json; then
            echo "::error::the template never versions itself: 1.0.0 is the spawn seed of every generated plugin, not a number to bump"
            exit 1
          fi

  # Renders the scaffold against representative fixtures and asserts that no template literal
  # survives, every PHP file parses, and the wp-env port block matches the engine's hash. It replays
  # fill-in-scaffold.yml's rename, substitution, and strip steps; change them together.
  generation-contract:
    name: 'Generation contract: ${{ matrix.fixture }}'
    if: github.repository_id == '1297277915'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: aligned
            strip: false
            lint: true
            repo_json: '{"name":"my-client-plugin","description":"A client plugin.","custom_properties":{"human-title":"My Client Plugin","php-globals-short-prefix":"myclient"}}'
          - fixture: diverging-empty
            strip: false
            repo_json: '{"name":"acme-tools","description":"","custom_properties":{"human-title":"Acme Corporation Tools","php-globals-short-prefix":"acme_tools"}}'
          - fixture: hostile-description
            strip: false
            repo_json: '{"name":"quote-plugin","description":"He said \"deploy\" \\ fast","custom_properties":{"human-title":"Quote Plugin","php-globals-short-prefix":"quotes"}}'
          - fixture: stripped
            strip: true
            repo_json: '{"name":"my-client-plugin","description":"A client plugin.","custom_properties":{"human-title":"My Client Plugin","php-globals-short-prefix":"myclient"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP for the syntax sweep
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Replicate the fill-in sequence
        env:
          REPO_JSON: ${{ matrix.repo_json }}
          STRIP: ${{ matrix.strip }}
        run: |
          set -euo pipefail

          REPO_NAME=$(printf '%s' "$REPO_JSON" | jq -r .name)
          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

          git mv --force README.scaffold.md README.md
          git mv a8csp-template-plugin.php "$REPO_NAME.php"

          find changelog -type f ! -name '.gitkeep' -delete

          node ./.github/workflows/fill-in-scaffold.mjs "$REPO_JSON"

          if [ "$STRIP" = 'true' ]; then
            node ./.github/workflows/fill-in-scaffold-content.mjs
          fi

          # The engines strip their own paths from the lint scope; a leftover reference is docrot.
          if grep -qF '.github/workflows/fill-in-scaffold' package.json; then
            echo '::error::the rendered package.json still references the self-deleting .mjs engines in lint:scripts'
            exit 1
          fi

      # .github is excluded because the real run deletes the spent machinery instead of
      # substituting inside it; the real run resolves both locks afresh after this point.
      - name: Assert no template literal survives
        run: |
          set -euo pipefail

          fail=0
          for literal in 'a8csp-plugin-template' 'a8csp-template-plugin' 'A8CSP Template Plugin' 'a8csp_template' 'A8CSP_TEMPLATE' 'A8C\SpecialProjects\PluginTemplate' 'PluginTemplate' 'EXAMPLE_REPO_'; do
            if survivors=$(grep -rIlF --exclude-dir=node_modules --exclude-dir=vendor --exclude-dir=.git --exclude-dir=.github --exclude=composer.lock --exclude=package-lock.json -- "$literal" .); then
              printf '%s\n' "$survivors"
              echo "::error::template literal '$literal' survived substitution"
              fail=1
            fi
          done
          exit "$fail"

      - name: Syntax-check every generated PHP file
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Assert the derived wp-env port block
        run: |
          set -euo pipefail

          hex=$(printf '%s' "$REPO_NAME" | shasum -a 256 | cut -c1-8)
          expected=$(( 10000 + 4 * ( 16#$hex % 5000 ) ))
          grep -Fq "\"port\": $expected," .wp-env.tests.json
          grep -Fq "\"port\": $(( expected + 1 ))," .wp-env.belowfloor.json
          grep -Fq "\"port\": $(( expected + 2 ))," .wp-env.multisite.json
          grep -Fq "\"port\": $(( expected + 3 ))," .wp-env.json

      - name: Assert the strip phase removed the sample content
        if: matrix.strip == true
        run: test ! -f includes/_disabled-example.php

      - name: Setup Node.js for the generated repository's JavaScript lint
        if: matrix.lint == true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      # Substitution changes identifier lengths, so Prettier-formatted lines need re-wrapping before the
      # generated repository's own lint can pass.
      - name: Re-format and lint the rendered JavaScript
        if: matrix.lint == true
        run: |
          npm ci
          npm run lint:scripts -- --fix
          npm run lint:scripts

  # A template edit that leaves a strip-manifest span matching zero or several times fails here
  # instead of in a generation.
  content-manifest-drift:
    name: Enforce the teaching-content strip manifest
    if: github.repository_id == '1297277915'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The manifest check is a dependency-free string match, so the runner's built-in Node runs it.
      - name: Verify every strip-manifest span still matches exactly once
        run: node .github/workflows/fill-in-scaffold-content.mjs --check
