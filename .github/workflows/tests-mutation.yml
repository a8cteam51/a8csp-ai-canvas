name: Mutation Tests

on:
  schedule:
    # Mutation testing is slow, so it runs off the pull request and push path.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run mutation tests
        run: composer test:unit:mutation -- --logger-summary-json=build/infection/infection-summary.json --no-progress

      - name: Guard against a vacuously-green zero-mutant run
        run: |
          # Infection can exit 0 with zero mutants and no report; a run that tested nothing fails.
          summary=build/infection/infection-summary.json
          if [ ! -s "$summary" ]; then
            echo "::error::no Infection summary report at $summary — zero mutants were generated (or the run aborted before reporting). A green mutation job with zero mutants is not a pass."
            exit 1
          fi

          count=$(jq -e '.stats.totalMutantsCount' "$summary") || {
            echo "::error::the Infection summary at $summary is missing stats.totalMutantsCount — cannot confirm mutants were generated."
            exit 1
          }

          if [ "$count" = "null" ] || [ "$count" -eq 0 ]; then
            echo "::error::zero mutants generated (totalMutantsCount=$count) — a vacuous run is not a pass."
            exit 1
          fi

          echo "Infection generated $count mutants."

      # Keep the report even when the run or the guard above fails, to diagnose from.
      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-logs
          path: build/infection/
