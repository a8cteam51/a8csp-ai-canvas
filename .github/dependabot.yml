version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      exclude:
        - "a8cteam51/a8csp-configs/*"
    ignore:
      - dependency-name: "a8cteam51/a8csp-configs/*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      exclude:
        - "a8csp/configs"
    ignore:
      - dependency-name: "a8csp/configs"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "composer"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      exclude:
        - "@a8csp/configs"
    ignore:
      - dependency-name: "@a8csp/configs"
        update-types: ["version-update:semver-major"]
      # From 36, test-unit-js runs Vitest, and the unit tests are Jest. Moves with a8csp-plugin-template.
      - dependency-name: "@wordpress/scripts"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "npm"
    open-pull-requests-limit: 5
