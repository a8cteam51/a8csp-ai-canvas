name: Bug report
description: Create a bug report to help us improve.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new page in the page editor, in a browser with WebMCP.
        2. Ask the agent to build the page.
        3. ...

        Attach any media by drag and dropping or selecting upload.

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
      placeholder: |
        e.g. The page appears in the editor on the header and footer template.

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: |
        e.g. The tool returns an error and the browser console shows a warning.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The versions the bug occurred on, plus anything unusual about the setup (multisite, other plugins involved).
      placeholder: |
        - WordPress version:
        - PHP version:
        - Browser and version:
        - Agent:
        - Theme:
        - Plugin version:
        - Multisite: yes/no
    validations:
      required: true
