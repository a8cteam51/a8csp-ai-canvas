name: Bug report
description: Create a bug report to help us improve.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Activate the plugin alongside WooCommerce.
        2. Go to WooCommerce → Settings → Advanced.
        3. ...

        Attach any media by drag and dropping or selecting upload.

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
      placeholder: |
        e.g. The plugin's settings section appears in the Advanced tab.

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      placeholder: |
        e.g. The section is missing and the error log shows a warning.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The versions the bug occurred on, plus anything unusual about the setup (multisite, other plugins involved).
      placeholder: |
        - WordPress version:
        - PHP version:
        - WooCommerce version:
        - Plugin version:
        - Multisite: yes/no
    validations:
      required: true
